<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم – قطن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0F4;--sf:#fff;--ink:#1E2B55;--mute:#5b6485;--ac:#E0A526;--line:#d6dae6}
@media (prefers-color-scheme:dark){:root{--bg:#121830;--sf:#1b2447;--ink:#eef0f8;--mute:#a4abc9;--line:#2c376a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,system-ui,sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:auto;padding:16px 20px 80px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.5rem;margin:8px 0}
a{color:var(--ink);font-weight:600}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:8px;padding:6px 14px;font-weight:600}
button.pri{background:var(--ac);color:#1E2B55;border-color:var(--ac);font-weight:800}
button.del{color:#b3261e}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[type=color]{padding:0;height:34px}
.note{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--mute);margin:8px 0 16px}
.pc{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:start}
.th{width:70px;height:88px;border-radius:8px;display:grid;place-items:center;overflow:hidden;font-size:1.8rem}
.th img{width:100%;height:100%;object-fit:cover}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.f label{font-size:.82rem;color:var(--mute);display:block}
.chk{display:flex!important;gap:6px;align-items:center;padding-top:20px}
.chk input{width:auto}
.act{display:flex;flex-direction:column;gap:6px}
.bar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
#st{color:var(--mute);min-height:1.6em}
@media (max-width:640px){.pc{grid-template-columns:60px 1fr}.act{flex-direction:row;grid-column:1/-1;flex-wrap:wrap}.th{width:60px;height:76px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>لوحة تحكم المنتجات</h1><a href="index.html">المتجر</a></header>
<div class="note"><b>إزاي تشتغل:</b> 1) عدّل المنتجات تحت. 2) اضغط «تنزيل products.js». 3) في GitHub افتح المستودع واضغط <b>Add file ثم Upload files</b> وارفع الملف بنفس الاسم مكان القديم. 4) استنى دقيقة وحدّث المتجر. الصور: ارفعها في فولدر <b>images</b> على GitHub.</div>
<div id="list"></div>
<p id="st"></p>
<div class="bar"><button id="addp">+ منتج جديد</button><button id="dl" class="pri">تنزيل products.js</button><button id="cp">نسخ الكود</button><button id="reset">استرجاع من الملف</button></div>
<input type="file" id="fp" accept="image/*" hidden>
</div>
<script src="products.js"></script>
<script>
const KEY="qutn_admin_draft",$=id=>document.getElementById(id);
let L=null,pickI=-1;
try{const d=localStorage.getItem(KEY);if(d)L=JSON.parse(d)}catch(e){}
if(!Array.isArray(L))L=JSON.parse(JSON.stringify(window.PRODUCTS||[]));
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say=t=>$("st").textContent=t;
function save(){try{localStorage.setItem(KEY,JSON.stringify(L));say("اتحفظت مسودة في المتصفح. لسه ما اترفعتش على GitHub.")}catch(e){say("تعذّر حفظ المسودة. نزّل الملف قبل ما تقفل الصفحة.")}}
function render(){
 $("list").innerHTML=L.map((x,i)=>`<div class="pc" data-i="${i}"><div class="th" style="background:${esc(x.k)}33">${x.img?`<img src="${esc(x.img)}" alt="">`:`<span style="color:${esc(x.k)}">👕</span>`}</div>
 <div class="f"><label>الاسم<input data-f="n" value="${esc(x.n)}"></label><label>التصنيف<input data-f="c" value="${esc(x.c)}"></label><label>السعر (جنيه)<input data-f="p" type="number" min="0" value="${esc(x.p)}"></label><label>اللون<input data-f="k" type="color" value="${esc(x.k||"#7aa2d6")}"></label><label>الشكل<select data-f="s"><option value="tee"${x.s==="tee"?" selected":""}>علوي</option><option value="pant"${x.s==="pant"?" selected":""}>بنطلون</option></select></label><label>مسار الصورة<input data-f="img" placeholder="images/hoodie.jpg" value="${esc(x.img||"")}"></label><label class="chk"><input data-f="on" type="checkbox"${x.on!==false?" checked":""}> معروض</label></div>
 <div class="act"><button data-a="up" aria-label="أعلى">↑</button><button data-a="dn" aria-label="أسفل">↓</button><button data-a="pick">اختر صورة</button><button class="del" data-a="del">حذف</button></div></div>`).join("")||'<div class="note">مفيش منتجات. اضغط «منتج جديد».</div>';
}
$("list").addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(!f)return;const i=+t.closest(".pc").dataset.i;L[i][f]=t.type==="checkbox"?t.checked:t.type==="number"?(t.value===""?0:+t.value):t.value;save()});
$("list").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=+b.closest(".pc").dataset.i,a=b.dataset.a;
 if(a==="del"){if(confirm("حذف المنتج؟")){L.splice(i,1);save();render()}}
 else if(a==="up"&&i>0){[L[i-1],L[i]]=[L[i],L[i-1]];save();render()}
 else if(a==="dn"&&i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];save();render()}
 else if(a==="pick"){pickI=i;$("fp").value="";$("fp").click()}});
$("fp").addEventListener("change",e=>{const f=e.target.files[0];if(!f||pickI<0)return;L[pickI].img="images/"+f.name;save();render();say("اتكتب المسار images/"+f.name+". ارفع الصورة نفسها في فولدر images على GitHub بنفس الاسم.")});
$("addp").onclick=()=>{L.push({n:"منتج جديد",c:"عام",p:0,k:"#7aa2d6",s:"tee"});save();render();window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})};
function code(){const c=L.map(x=>{const o={n:String(x.n||"").trim(),c:String(x.c||"عام").trim(),p:Number(x.p)||0,k:x.k||"#7aa2d6",s:x.s==="pant"?"pant":"tee"};if(x.img&&String(x.img).trim())o.img=String(x.img).trim();if(x.on===false)o.on=false;return"  "+JSON.stringify(o)});return"window.PRODUCTS=[\n"+c.join(",\n")+"\n];\n"}
$("dl").onclick=()=>{const u=URL.createObjectURL(new Blob([code()],{type:"text/javascript;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="products.js";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);say("اتنزّل products.js. ارفعه على GitHub مكان القديم.")};
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText(code());say("اتنسخ الكود. الصقه في products.js على GitHub.")}catch(e){say("تعذّر النسخ. استخدم زرار التنزيل.")}};
$("reset").onclick=()=>{if(confirm("هتمسح تعديلاتك غير المرفوعة وترجع لمحتوى products.js الحالي. متأكد؟")){try{localStorage.removeItem(KEY)}catch(e){}L=JSON.parse(JSON.stringify(window.PRODUCTS||[]));render();say("اترجعت المنتجات من الملف.")}};
render();
</script>
</body>
</html>
